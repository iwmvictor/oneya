<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline · ONEYA</title>
<style>
  :root { color-scheme: light dark; --bg:#faf8f4; --fg:#2a2522; --muted:#6b645e; --brand:#a82424; --border:#e4dfd8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1b19; --fg:#efece8; --muted:#a9a29b; --brand:#e0605a; --border:#38342f; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:26rem; text-align:center; }
  img { width:72px; height:72px; }
  h1 { font-size:1.375rem; margin:16px 0 8px; }
  p { margin:0 0 12px; color:var(--muted); line-height:1.5; }
  button, a.btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 20px; margin:6px 4px 0;
    border-radius:6px; font:inherit; font-weight:600; text-decoration:none; cursor:pointer; }
  button { background:var(--brand); color:#fff; border:0; }
  a.btn { border:1px solid var(--border); color:var(--fg); }
  :focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <img src="/brand/logo-96.png" alt="" width="72" height="72">
  <h1>You're offline</h1>
  <p>Live radio and TV need an internet connection. Pages you've opened before may still load.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <a class="btn" href="/">Go to ONEYA</a>
</main>
</body>
</html>
